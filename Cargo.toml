[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.27.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/IanHeinrich/stellaris-galaxy-forge"

[workspace.dependencies]
sgf-core = { path = "crates/sgf-core" }
sgf-gamedata = { path = "crates/sgf-gamedata" }

# Full debug info makes every Windows link write a large PDB; line tables keep file:line in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# `tauri dev` runs the core unoptimised otherwise, and scenario edits then run tens of times slower than a release.
[profile.dev.package.sgf-core]
opt-level = 2

# Model sprites bake about fourteen times slower unoptimised, so a drag or a thumbnail waits seconds.
[profile.dev.package.sgf-gamedata]
opt-level = 2

# The tests run three to four times faster with dependencies optimised; memchr and similar alone give half of it.
[profile.dev.package."*"]
opt-level = 2
