name: Changelog

on:
  pull_request:
    # labeled/unlabeled so adding the skip label re-runs this required check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelog fragment or CHANGELOG.md entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bash scripts/changelog.sh check "origin/$BASE_REF"

      - name: Changelog check skipped
        if: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: 'echo "skipped: skip-changelog label"'
