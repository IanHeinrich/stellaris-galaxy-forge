name: Release

on:
  push:
    branches: [main]
    # A documentation-only push needs no build and cannot be a release.
    # This list copies the one in scripts/docs-only.sh; ci.yml copies it too.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/pull_request_template.md"
      - ".gitattributes"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild, e.g. v0.2.0
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# Every release asset is named Stellaris-Galaxy-Forge-<version>-<suffix>; collecting the
# bundles, the updater manifest and the release notes all read the suffixes from here.
env:
  ASSET_NSIS: Windows-Installer.exe
  ASSET_MSI: Windows-Installer-MSI-for-IT.msi
  ASSET_PORTABLE: Windows-No-Install.zip
  ASSET_APPIMAGE: Linux.AppImage
  ASSET_DEB: Linux-Debian-Ubuntu.deb
  ASSET_RPM: Linux-Fedora.rpm
  ASSET_DMG: Mac.dmg
  ASSET_MAC_UPDATER: Mac-updater-only.tar.gz

# A push runs the checks and, when VERSION names a tag that does not exist yet, builds
# every platform beside them. The tag and the release are made last, only once every
# check and every build has passed. A dispatch rebuilds an existing tag's assets.
jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.decide.outputs.released }}
      tag: ${{ steps.decide.outputs.tag }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this push releases
        id: decide
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! git rev-parse -q --verify "refs/tags/$DISPATCH_TAG" >/dev/null; then
              echo "::error::Tag $DISPATCH_TAG does not exist."
              exit 1
            fi
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v=$(tr -d '[:space:]' < VERSION)
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; checks only"
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tauri-args: ""
            cli-asset: Windows
          # 22.04 keeps the AppImage compatible with older glibc than the latest image has.
          - os: ubuntu-22.04
            tauri-args: ""
            cli-asset: Linux
          - os: macos-latest
            tauri-args: --target universal-apple-darwin
            cli-asset: Mac
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: ./.github/actions/setup
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: App install
        shell: bash
        run: npm ci
        working-directory: app

      - name: Signing key present
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; the bundles could not be signed for the updater."
            exit 1
          fi

      - name: Certum credentials present
        if: runner.os == 'Windows'
        shell: bash
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          missing=""
          [ -n "$CERTUM_USERNAME" ] || missing="$missing CERTUM_USERNAME(secret)"
          [ -n "$CERTUM_OTP_URI" ] || missing="$missing CERTUM_OTP_URI(secret)"
          [ -n "$CERTUM_KEY_ID" ] || missing="$missing CERTUM_KEY_ID(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing. The Windows artifacts would be unsigned, so this release is stopped."
            exit 1
          fi

      # Pinned to main @ 2026-09-07 (7309c42); the repository publishes no tags or
      # releases. This action is handed the TOTP seed for the signing certificate.
      - name: Certum SimplySign session
        if: runner.os == 'Windows'
        uses: Rumia-Channel/windows-certum-signin@7309c42a695ddaf95cd705eaf95a4de8bbab2a0c
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ secrets.CERTUM_KEY_ID }}

      # Tauri finds signtool itself; the steps that sign outside the bundler need the path.
      - name: Locate signtool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw "signtool.exe (x64) was not found on this runner." }
          Write-Host $tool.FullName
          "SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV

      - name: App bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          # The thumbprint is not in the config file, so it is merged in here. Authenticode
          # signing has to happen inside the bundler: the updater's .sig is taken over the
          # finished bundle, so a bundle signed afterwards would no longer match it.
          args=(--config src-tauri/tauri.release.conf.json)
          if [ "$RUNNER_OS" = "Windows" ]; then
            # A file, not inline JSON: npm reaches the CLI through cmd.exe, which mangles
            # embedded quotes, and a thumbprint lost that way would skip signing silently.
            conf="$RUNNER_TEMP/sgf-signing.conf.json"
            printf '{"bundle":{"windows":{"certificateThumbprint":"%s"}}}' "$CERTUM_KEY_ID" > "$conf"
            args+=(--config "$(cygpath -w "$conf")")
          fi
          npm run tauri build -- "${args[@]}" ${{ matrix.tauri-args }}
        working-directory: app

      - name: Collect the bundles
        shell: bash
        run: |
          mkdir -p dist
          find target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.sig' -o -name '*.app.tar.gz' \) \
            -print0 |
          while IFS= read -r -d '' f; do
            name=$(basename "$f")
            sig=""
            case "$name" in *.sig) sig=.sig; name=${name%.sig} ;; esac
            case "$name" in
              *-setup.exe) kind=$ASSET_NSIS ;;
              *.msi) kind=$ASSET_MSI ;;
              *.AppImage) kind=$ASSET_APPIMAGE ;;
              *.deb) kind=$ASSET_DEB ;;
              *.rpm) kind=$ASSET_RPM ;;
              *.dmg) kind=$ASSET_DMG ;;
              *.app.tar.gz) kind=$ASSET_MAC_UPDATER ;;
              *) echo "::error::No release name for the bundle $name."; exit 1 ;;
            esac
            out="dist/Stellaris-Galaxy-Forge-${TAG#v}-$kind$sig"
            if [ -e "$out" ]; then echo "::error::Two bundles would both be named $out."; exit 1; fi
            cp "$f" "$out"
          done
          ls -la dist

      - name: sgf command-line tool
        shell: bash
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          mkdir -p target/cli
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo build --release -p sgf-cli --target aarch64-apple-darwin
            cargo build --release -p sgf-cli --target x86_64-apple-darwin
            lipo -create -output target/cli/sgf \
              target/aarch64-apple-darwin/release/sgf \
              target/x86_64-apple-darwin/release/sgf
          else
            cargo build --release -p sgf-cli
            if [ -f target/release/sgf.exe ]; then
              cp target/release/sgf.exe target/cli/
            else
              cp target/release/sgf target/cli/
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Git Bash rewrites /fd and the other flags as paths unless told not to.
            MSYS_NO_PATHCONV=1 "$SIGNTOOL" sign /fd sha256 /sha1 "$CERTUM_KEY_ID" \
              /tr http://time.certum.pl /td sha256 /d "sgf" target/cli/sgf.exe
            (cd target/cli && 7z a "$GITHUB_WORKSPACE/dist/sgf-command-line-tool-${TAG#v}-${{ matrix.cli-asset }}.zip" sgf.exe)
          else
            tar -C target/cli -czf "dist/sgf-command-line-tool-${TAG#v}-${{ matrix.cli-asset }}.tar.gz" sgf
          fi

      - name: Portable app
        if: runner.os == 'Windows'
        shell: bash
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          exe="target/release/Stellaris Galaxy Forge.exe"
          if [ ! -f "$exe" ]; then
            exe="target/release/sgf-app.exe"
          fi
          if [ ! -f "$exe" ]; then
            echo "::error::No application executable found in target/release."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/portable"
          cp "$exe" "$RUNNER_TEMP/portable/"
          # The bundler signs this binary once per installer it builds, then restores the
          # unsigned copy it took beforehand, so what is left in target/release is unsigned.
          MSYS_NO_PATHCONV=1 "$SIGNTOOL" sign /fd sha256 /sha1 "$CERTUM_KEY_ID" \
            /tr http://time.certum.pl /td sha256 /d "Stellaris Galaxy Forge" \
            "$RUNNER_TEMP/portable/$(basename "$exe")"
          (cd "$RUNNER_TEMP/portable" && 7z a "$GITHUB_WORKSPACE/dist/Stellaris-Galaxy-Forge-${TAG#v}-$ASSET_PORTABLE" ./*.exe)

      # Tauri skips signing silently when it is given no thumbprint, so the artifacts are
      # checked rather than assumed.
      - name: Windows artifacts are signed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for f in dist/*.exe dist/*.msi; do
            [ -f "$f" ] || continue
            MSYS_NO_PATHCONV=1 "$SIGNTOOL" verify /pa "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    needs: [version, checks, build]
    if: >-
      ${{ !cancelled()
          && needs.version.outputs.released == 'true'
          && needs.build.result == 'success'
          && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      - name: Update manifest
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          base="https://github.com/$REPO/releases/download/$TAG"
          notes=$(bash scripts/changelog.sh notes "$v")

          pick() {
            local f
            for f in assets/*-"$1"; do
              [ -f "$f" ] && { basename "$f"; return; }
            done
            return 0
          }
          nsis=$(pick "$ASSET_NSIS")
          msi=$(pick "$ASSET_MSI")
          appimage=$(pick "$ASSET_APPIMAGE")
          macapp=$(pick "$ASSET_MAC_UPDATER")

          platforms='{}'
          add() {
            local key="$1" name="$2"
            if [ -z "$name" ]; then
              echo "::error::No asset for the updater platform $key."
              exit 1
            fi
            if [ ! -f "assets/$name.sig" ]; then
              echo "::error::$name has no signature; was TAURI_SIGNING_PRIVATE_KEY set?"
              exit 1
            fi
            platforms=$(jq -n --argjson p "$platforms" --arg k "$key" \
              --arg url "$base/$name" --arg sig "$(cat "assets/$name.sig")" \
              '$p + {($k): {url: $url, signature: $sig}}')
          }

          # The updater asks for {os}-{arch}-{installer} first, then {os}-{arch}; it never
          # asks for darwin-universal, so both macOS keys point at the one universal bundle.
          add windows-x86_64-nsis "$nsis"
          add windows-x86_64-msi "$msi"
          add windows-x86_64 "$nsis"
          add linux-x86_64-appimage "$appimage"
          add linux-x86_64 "$appimage"
          add darwin-aarch64 "$macapp"
          add darwin-x86_64 "$macapp"

          jq -n --arg version "$v" --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > assets/latest.json
          cat assets/latest.json
          # latest.json carries each signature, so the .sig files are not published.
          rm -f assets/*.sig

      - name: Checksums
        shell: bash
        run: |
          rm -f assets/SHA256SUMS
          (cd assets && sha256sum * > SHA256SUMS)
          ls -la assets

      - name: Tag and release
        if: github.event_name == 'push'
        shell: bash
        run: |
          # The token may only create a tag whose workflow files match main's; a push that
          # changed .github/workflows during this run would make the tag push fail.
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ] &&
             ! git diff --quiet "$GITHUB_SHA" origin/main -- .github/workflows; then
            echo "::error::main changed its workflows while this release ran; push a version bump again."
            exit 1
          fi
          v=$(tr -d '[:space:]' < VERSION)
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Stellaris-Galaxy-Forge-$v"
          {
            echo "### Which file do I download?"
            echo
            echo "- **Windows:** [$ASSET_NSIS]($dl-$ASSET_NSIS)."
            echo "  To run it without installing, [$ASSET_PORTABLE]($dl-$ASSET_PORTABLE)."
            echo "- **Mac:** [$ASSET_DMG]($dl-$ASSET_DMG). The Mac app is not signed, so see"
            echo "  [Installing](https://github.com/$GITHUB_REPOSITORY#installing) for how to open it."
            echo "- **Linux:** [$ASSET_APPIMAGE]($dl-$ASSET_APPIMAGE), or the \`.deb\` or \`.rpm\` package for your distribution."
            echo
            echo "You don't need the other files."
            echo
            bash scripts/changelog.sh notes "$v"
          } > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest assets/*

      - name: Replace the assets of an existing release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: gh release upload "$TAG" assets/* --clobber
