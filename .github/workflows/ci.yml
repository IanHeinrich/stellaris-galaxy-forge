name: CI

on:
  pull_request:
    # Documentation-only changes do not need the build; ci-docs.yml reports the checks for them.
    # This list copies the one in scripts/docs-only.sh; release.yml copies it too.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/pull_request_template.md"
      - ".gitattributes"
      - ".gitignore"
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI never reads the debug info, and leaving it out shortens the build and the links.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy

      - name: Version file agrees with the manifests
        run: bash scripts/version.sh check

      # Platform-independent checks run once, on Ubuntu; every runner still compiles and tests the workspace.
      - name: Rust format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Rust clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Generated TypeScript types are up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code app/src/generated

      - name: App install
        run: npm ci
        working-directory: app
      - name: App lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint
        working-directory: app
      - name: App tests
        if: matrix.os == 'ubuntu-latest'
        run: npm test
        working-directory: app
      - name: App build
        if: matrix.os == 'ubuntu-latest'
        run: npm run build
        working-directory: app

