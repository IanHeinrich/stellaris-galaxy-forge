name: CI

on:
  pull_request:
    # Documentation-only changes do not need the build; ci-docs.yml reports the checks for them.
    # This list copies the one in scripts/docs-only.sh; release.yml copies it too.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/pull_request_template.md"
      - ".gitattributes"
      - ".gitignore"
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI never reads the debug info, and leaving it out shortens the build and the links.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
          shared-key: lint
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Changelog script tests
        run: bash scripts/changelog_test.sh
      - name: Test shard script tests
        run: bash scripts/test-shard_test.sh
      - name: Version file agrees with the manifests
        run: bash scripts/version.sh check

      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: App install
        run: npm ci
        working-directory: app
      - name: App lint
        run: npm run lint
        working-directory: app
      - name: App tests
        run: npm test
        working-directory: app
      - name: App build
        run: npm run build
        working-directory: app

  # Shard 0 runs everything except sgf-core's integration tests. The other shards split those
  # tests, which take most of the time, across jobs.
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    env:
      # Read only when building for Windows. lld links faster than link.exe.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shard: 0, count: 0 }
          - { os: windows-latest, shard: 1, count: 3 }
          - { os: windows-latest, shard: 2, count: 3 }
          - { os: windows-latest, shard: 3, count: 3 }
          - { os: ubuntu-latest, shard: 0, count: 0 }
          - { os: ubuntu-latest, shard: 1, count: 3 }
          - { os: ubuntu-latest, shard: 2, count: 3 }
          - { os: ubuntu-latest, shard: 3, count: 3 }
          - { os: macos-latest, shard: 0, count: 0 }
          - { os: macos-latest, shard: 1, count: 2 }
          - { os: macos-latest, shard: 2, count: 2 }
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The shards build different crates, so shard 0 keeps its own cache and the rest share one.
      - uses: ./.github/actions/setup
        with:
          tauri: ${{ matrix.shard == 0 }}
          shared-key: test-${{ matrix.os }}-${{ matrix.shard == 0 && 'all' || 'core' }}
          save: ${{ github.ref == 'refs/heads/main' && (matrix.shard == 0 || matrix.shard == 1) }}

      - name: Version file agrees with the manifests
        if: matrix.shard == 0
        run: bash scripts/version.sh check
      # Every crate's unit tests in one build, so sgf-core's builds alongside the others. The
      # corpus binaries skip without their variables; clippy already builds them.
      - name: Unit tests
        if: matrix.shard == 0
        run: cargo test --workspace --lib --bins
      - name: Integration and doc tests outside sgf-core
        if: matrix.shard == 0
        run: |
          cargo test --workspace --exclude sgf-core --test integration
          cargo test --workspace --doc

      - name: sgf-core integration tests
        if: matrix.shard != 0
        run: bash scripts/test-shard.sh ${{ matrix.shard }} ${{ matrix.count }}

      # Shard 0 writes the ts-rs types and the shard holding constants:: writes constants.ts.
      - name: Generated TypeScript types are up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code app/src/generated

  checks:
    name: Checks (${{ matrix.os }})
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Lint and test jobs passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT"
          echo "test: $TEST"
          [ "$LINT" = success ] && [ "$TEST" = success ]
